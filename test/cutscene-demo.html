<!doctype html><meta charset="utf-8"><title>ACI cutscene demo</title>
<body style="margin:0;background:#111;color:#aaa;font:13px monospace">
<div id="screen" style="position:fixed;inset:0"></div>
<script src="/aci.js"></script><script src="/modules/anim.js"></script><script src="/modules/convert.js"></script>
<script src="/modules/sound.js"></script><script src="/modules/scenes.js"></script><script src="/modules/cutscene.js"></script>
<script>
// Procedural "footage": a figure walking toward a red doorway. Stand-in for a rotoscoped video.
function footage(n, W, H) {
  const out = [], c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  for (let i = 0; i < n; i++) {
    const t = i / n; x.fillStyle = '#10100e'; x.fillRect(0, 0, W, H);
    
    // doorway glow (the accent)
    const dg = x.createRadialGradient(W * .72, H * .5, 4, W * .72, H * .5, H * .6); dg.addColorStop(0, 'rgba(255,60,40,.95)'); dg.addColorStop(1, 'rgba(255,60,40,0)');
    x.fillStyle = dg; x.fillRect(0, 0, W, H);
    x.fillStyle = '#000'; x.fillRect(W * .66, H * .22, W * .12, H * .56);
    x.fillStyle = '#c0301f'; x.fillRect(W * .675, H * .26, W * .09, H * .5);
    // floor
    x.fillStyle = '#e6e6e6'; x.fillRect(0, H * .78, W, 3);
    // walking figure (silhouette)
    const px = W * (.1 + .42 * t), step = Math.sin(t * 40) * 10, hy = H * .5;
    x.fillStyle = '#f0f0f0'; x.beginPath(); x.arc(px, hy - 40, 12, 0, 7); x.fill();
    x.fillRect(px - 9, hy - 26, 18, 44);
    x.lineWidth = 8; x.strokeStyle = '#f0f0f0'; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px - 4, hy + 16); x.lineTo(px - 4 + step, H * .77); x.moveTo(px + 4, hy + 16); x.lineTo(px + 4 - step, H * .77); x.stroke();
    x.beginPath(); x.moveTo(px - 9, hy - 20); x.lineTo(px - 14 - step * .6, hy + 6); x.moveTo(px + 9, hy - 20); x.lineTo(px + 14 + step * .6, hy + 6); x.stroke();
    const spr = ACI.convert.image(c, { cols: 170, rows: 62, mode: 'luma', ramp: 'detailed', color: true, dither: 'none', fit: 'stretch' });
    out.push(spr.anims.default[0]);
  }
  return ACI.sprite({ default: out }, { fps: 12 });
}
const game = ACI.game('#screen', { fontSize: 14 });
game.assets = { walk: footage(24, 340, 190) };
game.layer((x, y, t) => [Math.sin(x * .3 + t) > 0 ? '/' : '|', '#3a6']);
game.add(ACI.sprite(' o \n/|\\\n/ \\', { color: '#fff' }), { x: 10, y: 6 });
game.cutscene.define('intro', {
  format: 'aci-cutscene', v: 1, name: 'intro',
  look: { fontSize: 7, preset: 'rotoscope', background: '#050505' }, skippable: true,
  shots: [
    { duration: 0, art: { text: 'THE LANTERNS WENT DARK', color: '#d1332a' }, fadeIn: 0.8, caption: { text: '...', speed: 6, pos: 'bottom' }, sound: [{ at: 0, sfx: 'fall' }] },
    { duration: 5, art: { asset: 'walk', fps: 12, loop: true, fit: 'contain' }, fadeIn: 0.2, fadeOut: 0.3,
      caption: { speaker: 'Elder', text: 'Walk toward the light, child. It is the only door left.', speed: 22, pos: 'bottom', color: '#d1332a' },
      sound: [{ at: 0.2, music: 'C2 _ _ G2 _ _ Eb2 _', bpm: 50, loop: true, wave: 'triangle' }] },
  ],
  onEnd: { state: { seenIntro: true } },
});
window.game = game;
if (location.hash !== '#manual') game.cutscene.play('intro');
</script>
