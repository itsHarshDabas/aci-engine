<!doctype html><meta charset="utf-8"><title>paint test</title>
<body style="margin:0;background:#050805;overflow:hidden"><div id="screen" style="width:100vw;height:100vh"></div>
<script src="../../aci.js"></script><script src="../../modules/convert.js"></script><script src="../../modules/anim.js"></script><script src="../../modules/input.js"></script><script src="../../modules/sound.js"></script>
<script src="data.js"></script><script>
window.PX = { D: window.PX_DATA, hash: (x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*982451653)|0;h=(h^(h>>13))*1274126177|0;return((h^(h>>16))>>>0)/4294967295;},
  mixc:(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');} };
</script>
<script src="px-paint.js"></script><script src="px-figures.js"></script>
<script>
const game = PX.game = ACI.game('#screen', { fontSize: 4, background: '#0a0d14' });
const t0 = performance.now();
const sheet = document.createElement('canvas');
const list = [['claire','side','idle',0],['claire','side','walk',2],['claire','side','light3',1],['claire','side','heavy',1],['claire','side','charge',0],['shade','side','slash',2],['shade','front','idle',0],['claire','front','walk',1],['claire','back','idle',0],['grandma','front','idle',0],['friend','front','idle',0],['office','front','idle',0],['officer','front','idle',0],['grandma','side','idle',0]];
let x = 10;
list.forEach(([n, v, k, i]) => {
  const c = PX.paint.figure(n, v, Object.assign({}, PX.paint.POSE0, PX.POSES[k][i]), { w: 110, h: 230, aura: k === 'charge' ? '#ffd24a' : (n==='shade'?'#8a2aff':null) });
  const spr = PX.paint.bake(c, 11);
  game.add(spr, { x, y: 8 + (list.indexOf(list.find(a=>a[0]===n&&a[1]===v&&a[2]===k)) % 2) * 0, z: 1 }); x += 30;
});
game.add(PX.paint.bake(PX.paint.building('home_exterior', PX.D.props.home_exterior, 64), 120), { x: 10, y: 60 });
game.add(PX.paint.bake(PX.paint.building('bar_front', PX.D.props.bar_front, 64), 135), { x: 140, y: 70 });
game.add(PX.paint.bake(PX.paint.tree('a', 128, 192), 30), { x: 290, y: 60 });
game.add(PX.paint.bake(PX.paint.propCanvas('fountain', PX.D.props.fountain, 64), 60), { x: 330, y: 62 });
console.log('baked in', Math.round(performance.now() - t0), 'ms');
</script>
