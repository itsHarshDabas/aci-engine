<!doctype html><meta charset="utf-8"><title>Project X 3D model sheet</title>
<body style="margin:0;background:#05070d;overflow:hidden"><div id="wrap" style="width:100vw;height:100vh"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
window.THREE = THREE;
window.PX = { settings: { font: +(new URLSearchParams(location.search).get('font') || 4) },
  hash: (x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*982451653)|0;h=(h^(h>>13))*1274126177|0;return((h^(h>>16))>>>0)/4294967295;},
  mixc:(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');} };
const load = s => new Promise(r => { const e = document.createElement('script'); e.src = s; e.onload = r; document.head.appendChild(e); });
for (const s of ['px-paint.js','px-figures.js','px-gfx.js','px-chars3d.js']) await load(s);
const PX = window.PX, G = PX.gfx, q = new URLSearchParams(location.search);
G.init(); document.getElementById('wrap').appendChild(G.canvas); G.canvas.style.cssText = 'width:100vw;height:100vh;display:block';
G.resize(innerWidth, innerHeight);
if (q.get('look')) G.setLook({ jitter: 0, grain: .12, levels: 4 });
const sc = G.scene; sc.background = new THREE.Color(0x070a12);
sc.add(new THREE.HemisphereLight(0xc8d4ff, 0x40302a, 2.2));
const sun = new THREE.DirectionalLight(0xfff0dd, 3.4); sun.position.set(-4, 9, 6); sun.castShadow = true; sc.add(sun);
const rim = new THREE.DirectionalLight(0x8aa8ff, 2.2); rim.position.set(4, 3, -6); sc.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 200), new THREE.MeshStandardMaterial({ color: 0x3a5a44, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; sc.add(floor);
const names = (q.get('who') || 'claire,shade,grandma,friend,office,officer').split(','), rigs = [];
const sp = 2.1;
names.forEach((n, i) => { const r = new PX.Rig(n); if (n === 'shade') {} r.root.position.set((i - (names.length - 1) / 2) * sp, 0, 0); sc.add(r.root); rigs.push(r); const act = q.get('act') || 'idle'; r.play(act, { loop: true }); if (q.get('katana') && n === 'claire') { r.giveKatana(); r.root.userData.k = 1; } });
const STANCES = { ready: { crouch: 7, lean: 6, head: -4, tF: 28, sF: 22, tB: -14, sB: 8, uF: 52, fF: 78, uB: 46, fB: 82, bob: 0 },
  guard: { crouch: 9, lean: 10, head: -6, tF: 34, sF: 26, tB: -22, sB: 14, uF: 80, fF: 60, uB: 74, fB: 66, bob: 0 },
  slash: { crouch: 12, lean: 26, head: -8, tF: 52, sF: 30, tB: -28, sB: 16, uF: 120, fF: 20, uB: 112, fB: 24, bob: 0 },
  high: { crouch: 5, lean: -4, head: 2, tF: 22, sF: 12, tB: -10, sB: 6, uF: 160, fF: 20, uB: 150, fB: 28, bob: 0 } };
if (q.get('stance')) rigs.forEach(r => { r.anim = null; r.applyPose(Object.assign({}, PX.paint.POSE0, STANCES[q.get('stance')])); });
const c = G.cam; c.dist = +(q.get('dist') || 13); c.pitch = +(q.get('pitch') || 38); c.tx = c.x = 0; c.tz = c.z = .4; c.ty = +(q.get('ty') || .85); G.camera.fov = 26; G.camera.updateProjectionMatrix();
let last = performance.now(), t = 0; window.__t = 0;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  rigs.forEach((r, i) => { r.root.rotation.y = (q.get('yaw') !== null ? +q.get('yaw') * Math.PI / 180 : t * .6 + i * .8); if (!q.get('stance')) r.update(dt); });
  G.updateCamera(dt); G.render(dt); window.__frames = (window.__frames || 0) + 1; requestAnimationFrame(frame); }
requestAnimationFrame(frame); window.__ready = true;
</script>
