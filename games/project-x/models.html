<!doctype html><meta charset="utf-8"><title>Project X model sheet</title>
<body style="margin:0;background:#0a0d14;overflow:hidden"><div id="screen" style="width:100vw;height:100vh"></div>
<script src="../../aci.js"></script><script src="../../modules/convert.js"></script><script src="../../modules/anim.js"></script>
<script>
window.PX = { hash: (x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*982451653)|0;h=(h^(h>>13))*1274126177|0;return((h^(h>>16))>>>0)/4294967295;},
  mixc:(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');} };
</script>
<script src="px-paint.js"></script><script src="px-figures.js"></script>
<script>
const q = new URLSearchParams(location.search), COLS = +(q.get('cols') || 26);
const game = PX.game = ACI.game('#screen', { fontSize: +(q.get('font') || 4), background: '#0a0d14' });
const Pn = PX.paint, POSES = PX.POSES, P0 = Pn.POSE0;
const DIRS = ['down', 'down-right', 'right', 'up-right', 'up', 'up-left', 'left', 'down-left'];
const labels = [];
function put(name, yaw, key, i, col, row, label) {
  const c = Pn.figure(name, yaw, Object.assign({}, P0, POSES[key][i]), { w: 84, h: 220 });
  const spr = Pn.bake(c, COLS, { res: 4 });
  game.add(spr, { x: 4 + col * (COLS + 6), y: 6 + row * 46 });
  labels.push([label, 4 + col * (COLS + 6) + COLS / 2, 6 + row * 46 + 43]);
}
const t0 = performance.now();
DIRS.forEach((d, k) => put('claire', k * 45, 'idle', 0, k, 0, 'Claire ' + d));
DIRS.forEach((d, k) => put('claire', k * 45, 'walk', 1, k + 8, 0, 'walk ' + d));
[['walk',2],['run',2],['light1',2],['light2',2],['light3',2],['heavy',3],['cast',2],['charge',0],['dodge',1],['hurt',0],['drink',1],['slash',2],['ko',1],['light3',1],['heavy',1],['cast',0]].forEach(([k,i], n) => put('claire', 45, k, i, n, 1, k + ' ' + i));
DIRS.forEach((d, k) => put('shade', k * 45, 'idle', 0, k, 2, 'Monster Claire ' + d));
[['walk',2],['run',2],['light1',2],['light3',2],['heavy',3],['cast',2],['charge',0],['slash',2]].forEach(([k,i], n) => put('shade', 45, k, i, n + 8, 2, 'shade ' + k));
['grandma','friend','office','officer'].forEach((o, n) => [0, 45, 90, 180].forEach((y, k) => put(o, y, 'idle', 0, n * 4 + k, 3, o + ' ' + y)));
console.log('baked', Math.round(performance.now() - t0), 'ms');
game.onOverlay((ctx, G) => {
  ctx.font = '600 12px "JetBrains Mono",monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#cfe4ff';
  labels.forEach(([t, x, y]) => ctx.fillText(t, x * G.cellW, y * G.cellH));
  ctx.textAlign = 'left'; ctx.font = '700 15px "JetBrains Mono",monospace'; ctx.fillStyle = '#ffd27a'; ctx.fillText('PROJECT X  ·  model sheet  ·  true 8-direction views for every action (3D-posed rig, fine-density glyph sprites)', 12, 14);
});
</script>
