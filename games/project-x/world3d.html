<!doctype html><meta charset="utf-8"><title>Project X 3D overworld test</title>
<body style="margin:0;background:#05070d;overflow:hidden"><div id="wrap" style="width:100vw;height:100vh;position:relative"></div>
<div id="hud" style="position:absolute;left:12px;top:10px;color:#cfe;font:14px monospace;text-shadow:0 0 4px #000;pointer-events:none"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
window.THREE = THREE; const q = new URLSearchParams(location.search);
window.PX = { settings: { font: +(q.get('font') || 4) }, clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  hash: (x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*982451653)|0;h=(h^(h>>13))*1274126177|0;return((h^(h>>16))>>>0)/4294967295;},
  mixc:(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');} };
const load = s => new Promise(r => { const e = document.createElement('script'); e.src = s; e.onload = r; document.head.appendChild(e); });
for (const s of ['data.js','px-paint.js','px-figures.js','px-gfx.js','px-chars3d.js','px-world3d.js']) { await load(s); if (s === 'data.js') window.PX.D = window.PX_DATA; }
const PX = window.PX, G = PX.gfx, W = PX.World3; PX.D = window.PX_DATA;
G.init(); document.getElementById('wrap').appendChild(G.canvas); G.canvas.style.cssText = 'width:100vw;height:100vh;display:block'; G.resize(innerWidth, innerHeight);
W.night = +(q.get('night') || 0); W.load(q.get('area') || 'street', q.get('x') ? [+q.get('x'), +q.get('y')] : null);
const map = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', Shift: 'sprint', e: 'ok', Enter: 'ok' };
addEventListener('keydown', e => { const k = map[e.key]; if (k) W.keys[k] = 1; }); addEventListener('keyup', e => { const k = map[e.key]; if (k && k !== 'ok') W.keys[k] = 0; });
if (q.get('walk')) { const [dx, dy] = q.get('walk').split(',').map(Number); W.keys.right = dx > 0; W.keys.left = dx < 0; W.keys.down = dy > 0; W.keys.up = dy < 0; W.keys.sprint = !!q.get('sprint'); }
let last = performance.now(); window.__frames = 0;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; W.update(dt); G.render(dt); window.__frames++;
  document.getElementById('hud').textContent = (W.banner ? W.banner.text + '\n' : '') + (W.prompt ? W.prompt.text : '') + (W.say ? '\n' + W.say.text : ''); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
