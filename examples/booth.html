<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Booth — ACI converter</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#05070d;color:#cfe;font:13px/1.4 system-ui,sans-serif}
  #app{display:flex;height:100%} #side{width:290px;flex:none;padding:14px;overflow:auto;background:#0b1020;border-right:1px solid #1c2540}
  #stage{flex:1;position:relative;min-width:0} #screen{position:absolute;inset:0}
  h1{font-size:15px;margin:0 0 2px;color:#fff} p.sub{margin:0 0 12px;color:#7a8bb0}
  label{display:block;margin:9px 0 3px;color:#9fb0d0;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  select,input[type=text]{width:100%;background:#131a30;color:#cfe;border:1px solid #26335a;border-radius:6px;padding:6px}
  input[type=range]{width:100%} .row{display:flex;gap:6px;flex-wrap:wrap}
  button{background:#1b2a55;color:#dfe;border:1px solid #33478a;border-radius:6px;padding:6px 9px;cursor:pointer;font:inherit}
  button:hover{background:#25397a} .chk{display:flex;align-items:center;gap:6px;margin-top:8px;color:#cfe;text-transform:none;font-size:12px;letter-spacing:0}
  #drop{margin:10px 0;border:1px dashed #33478a;border-radius:8px;padding:14px;text-align:center;color:#7a8bb0}
  #drop.over{background:#14224a;color:#fff} .val{float:right;color:#cfe}
  #msg{position:absolute;left:12px;bottom:8px;color:#7a8bb0;pointer-events:none}
  @media(max-width:700px){#app{flex-direction:column-reverse}#side{width:auto;max-height:50%;border-right:0;border-top:1px solid #1c2540}}
</style></head><body>
<div id="app">
 <div id="side">
  <h1>ASCII Booth</h1><p class="sub">Drop an image, GIF or video — get ASCII.</p>
  <div id="drop">drop a file here<br><small>PNG · JPG · GIF · WebP · MP4</small><br><br><input id="file" type="file" accept="image/*,video/*"></div>
  <div class="row"><button id="s1">sample picture</button><button id="s2">sample animation</button><button id="cam">webcam</button></div>
  <label>Style</label>
  <select id="mode"><option value="luma">Classic characters</option><option value="blocks">Half-blocks (2× detail)</option><option value="braille">Braille dots</option><option value="edges">Edges / line art</option></select>
  <label>Characters</label>
  <select id="ramp"></select>
  <input id="custom" type="text" placeholder="…or type your own, dark→bright" style="margin-top:6px">
  <label>Colour</label>
  <select id="color"><option value="full">Full colour</option><option value="mono">Mono (tint)</option><option value="palette:gameboy">Palette: Game Boy</option><option value="palette:c64">Palette: C64</option><option value="palette:pico8">Palette: PICO-8</option><option value="palette:sepia">Palette: Sepia</option><option value="palette:matrix">Palette: Matrix</option><option value="palette:amber">Palette: Amber</option><option value="gradient:ice">Gradient: Ice</option><option value="gradient:amber">Gradient: Amber</option></select>
  <label>Dithering</label>
  <select id="dither"><option value="auto">Auto</option><option value="none">None</option><option value="floyd">Floyd–Steinberg</option><option value="bayer">Ordered (Bayer)</option><option value="atkinson">Atkinson</option></select>
  <label>Width <span class="val" id="vcols"></span></label><input id="cols" type="range" min="20" max="200" value="80">
  <label>Contrast <span class="val" id="vcon"></span></label><input id="con" type="range" min="0.4" max="2.5" step="0.05" value="1">
  <label>Brightness <span class="val" id="vbri"></span></label><input id="bri" type="range" min="-0.5" max="0.5" step="0.02" value="0">
  <label>Gamma <span class="val" id="vgam"></span></label><input id="gam" type="range" min="0.4" max="2.5" step="0.05" value="1">
  <label class="chk"><input id="inv" type="checkbox"> invert</label>
  <label class="chk"><input id="auto" type="checkbox" checked> auto levels</label>
  <label class="chk"><input id="bgc" type="checkbox"> colour behind characters</label>
  <label>Save</label>
  <div class="row"><button id="dl">.aci.json</button><button id="dltxt">.txt</button><button id="cp">copy text</button><button id="dlhtml">.html</button></div>
 </div>
 <div id="stage"><div id="screen"></div><div id="msg"></div></div>
</div>
<script src="../aci.js"></script>
<script src="../modules/convert.js"></script>
<script>
const C = ACI.convert, $ = id => document.getElementById(id);
const game = ACI.game('#screen', { fontSize: 10 });
let ent = null, source = null, live = null, liveFn = null, timer = 0, current = null;
game.layer((x, y, t, G) => (live && liveFn ? liveFn(x, y, t, G) : null), 1);

// charset menu
const RAMPS = Object.keys(C.RAMPS).filter(k => k !== 'braille');
$('ramp').innerHTML = RAMPS.map(k => `<option value="${k}">${k}  ${C.RAMPS[k].slice(0, 14)}</option>`).join('');
['cols', 'con', 'bri', 'gam'].forEach(k => { const m = { cols: 'vcols', con: 'vcon', bri: 'vbri', gam: 'vgam' }; $(k).oninput = () => { $(m[k]).textContent = $(k).value; schedule(); }; $(m[k]).textContent = $(k).value; });
['mode', 'ramp', 'color', 'dither', 'inv', 'auto', 'bgc', 'custom'].forEach(k => ($(k).oninput = $(k).onchange = schedule));

function opts() {
  const o = { cols: +$('cols').value, mode: $('mode').value, ramp: $('custom').value.length > 1 ? $('custom').value : $('ramp').value, dither: $('dither').value,
    contrast: +$('con').value, brightness: +$('bri').value, gamma: +$('gam').value, invert: $('inv').checked, autoLevels: $('auto').checked, bg: $('bgc').checked ? 'color' : 'none' };
  const c = $('color').value;
  if (c === 'full') o.color = true; else if (c === 'mono') { o.color = false; o.tint = '#7dffa0'; }
  else if (c.startsWith('palette:')) { o.color = 'palette'; o.palette = c.slice(8); }
  else { o.color = 'gradient'; o.gradient = C.PALETTES[c.slice(9)]; }
  o.cols = Math.min(o.cols, game.viewCols);
  return o;
}
function schedule() { clearTimeout(timer); timer = setTimeout(render, 60); }
function show(spr) {
  current = spr;
  if (ent) game.remove(ent);
  ent = game.add(spr, { x: Math.max(0, Math.floor((game.viewCols - spr.w) / 2)), y: Math.max(0, Math.floor((game.viewRows - spr.h) / 2)), reflect: false, clear: false });
  $('msg').textContent = spr.w + '×' + spr.h + ' cells · ' + Object.values(spr.anims)[0].length + ' frame(s)';
}
async function render() {
  if (!source || live) return;
  const o = opts();
  try {
    let spr;
    if (source.kind === 'el') spr = C.image(source.el, o);
    else if (source.kind === 'buf') spr = await C.load(source.buf, o);
    else if (source.kind === 'frames') { const fr = source.els.map(e => C.image(e, o).anims.default[0]); spr = ACI.sprite(fr, { fps: 8 }); }
    else if (source.kind === 'video') spr = await C.video(source.file, Object.assign(o, { fps: 8, maxFrames: 60, onProgress: p => ($('msg').textContent = 'converting video… ' + Math.round(p * 100) + '%') }));
    show(spr);
  } catch (e) { $('msg').textContent = 'could not convert: ' + e.message; }
}

// ---- samples drawn with canvas so the page needs no image files
function sampleCanvas(t = 0) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 200; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 200); g.addColorStop(0, '#1b1f5e'); g.addColorStop(0.55, '#d2557a'); g.addColorStop(1, '#ffb347'); x.fillStyle = g; x.fillRect(0, 0, 320, 200);
  x.fillStyle = '#fff3c0'; x.beginPath(); x.arc(160 + Math.sin(t) * 60, 105 - Math.abs(Math.cos(t)) * 40, 34, 0, 7); x.fill();
  x.fillStyle = '#2a1840'; x.beginPath(); x.moveTo(0, 200); x.lineTo(0, 150); for (let i = 0; i <= 8; i++) x.lineTo(i * 40, 150 - ((i * 37) % 5) * 12 - 10); x.lineTo(320, 200); x.fill();
  x.fillStyle = '#0d0a1a'; x.fillRect(0, 175, 320, 25);
  x.fillStyle = '#fff'; x.font = 'bold 28px sans-serif'; x.fillText('ACI', 12, 36);
  return c;
}
$('s1').onclick = () => { live = null; source = { kind: 'el', el: sampleCanvas(0.4) }; render(); };
$('s2').onclick = () => { live = null; source = { kind: 'frames', els: Array.from({ length: 24 }, (_, i) => sampleCanvas(i / 24 * Math.PI * 2)) }; render(); };
$('cam').onclick = async () => {
  try { const v = await C.webcam(); live = v; if (ent) { game.remove(ent); ent = null; }
    const upd = () => { const o = opts(); o.fit = 'stretch'; liveFn = C.liveLayer(v, o); }; upd(); window.refreshLive = upd; $('msg').textContent = 'webcam live'; }
  catch (e) { $('msg').textContent = 'webcam unavailable: ' + e.message; }
};
const origSchedule = schedule;
function loadFile(f) {
  live = null;
  if (/^video\//.test(f.type)) source = { kind: 'video', file: f };
  else f.arrayBuffer().then(buf => { source = { kind: 'buf', buf }; render(); });
  if (/^video\//.test(f.type)) render();
}
$('file').onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
const drop = $('drop');
['dragenter', 'dragover'].forEach(n => addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
addEventListener('drop', e => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));
addEventListener('paste', e => { const f = [...(e.clipboardData.files || [])][0]; if (f) loadFile(f); });

// ---- export
function save(name, text, type = 'text/plain') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
$('dl').onclick = () => current && save('converted.aci.json', JSON.stringify(C.toAsset(current, 'converted')), 'application/json');
$('dltxt').onclick = () => current && save('converted.txt', C.toText(current));
$('dlhtml').onclick = () => current && save('converted.html', C.toHTML(current), 'text/html');
$('cp').onclick = () => current && navigator.clipboard.writeText(C.toText(current)).then(() => ($('msg').textContent = 'copied'));
game.on('resize', () => { if (ent && current) show(current); if (window.refreshLive && live) window.refreshLive(); });
$('s1').click();
</script>
</body></html>
