<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern Run</title>
<style>html,body{margin:0;height:100%;background:#05070d;overflow:hidden}#screen{position:fixed;inset:0}</style>
</head><body>
<div id="screen"></div>
<script src="../aci.js"></script>
<script src="../modules/anim.js"></script>
<script>
/*  Lantern Run — walk a scrolling night forest and catch 12 fireflies; dodge the wisps.
    Shows: camera follow, a sprite with idle/walk animations (game.animate), colour-mapped art,
    emitters (fire, smoke, rain, sparkles, dust trail), particle bursts, floating text, shake, tweens, mask + water reflection.
    WASD / arrows to move.  R toggles rain.  */
const WORLD = { cols: 180, rows: 80 };
const game = ACI.game('#screen', { fontSize: 15, world: WORLD });
const A = ACI.anim, hud = game.screen;
const rand = (a, b) => a + Math.random() * (b - a);
const NIGHT = '#05070d';

// ---------- the ground is a "shader": one function runs for every visible cell, every frame
const POND = { x: 120, y: 42, rx: 24, ry: 9 };
game.mask('water', (x, y) => ((x - POND.x) / POND.rx) ** 2 + ((y - POND.y) / POND.ry) ** 2 < 1);
game.reflect('water', { tint: '#10204a', amount: 0.5 });
const CAMP = { x: 40, y: 36 };
let hero;
game.layer((x, y, t) => {
  // lantern light: bright near the hero, fading to night
  let light = 0.18;
  if (hero) { const d = Math.hypot((x - hero.x - 1) * 0.55, y - hero.y - 1); light = Math.max(light, 1 - d / 15); }
  const dc = Math.hypot((x - CAMP.x) * 0.55, y - CAMP.y); light = Math.max(light, 1 - dc / 11 + Math.sin(t * 9) * 0.04);
  light = Math.max(0, Math.min(1, light));
  let ch, col;
  if (game.is('water', x, y)) {
    const w = Math.sin(x * 0.5 + t * 1.6) + Math.sin(y * 1.3 - t * 1.1);
    ch = w > 0.8 ? '≈' : w > -0.4 ? '~' : '-'; col = w > 1 ? '#6aa8ff' : '#2d5fb0';
  } else {
    const n = ACI.fbm(x * 0.09, y * 0.18, 3);
    const sway = Math.sin(t * 1.8 + x * 0.35 + y * 0.12);
    if (n > 0.55) { ch = sway > 0.2 ? '/' : sway < -0.2 ? '\\' : '|'; col = n > 0.68 ? '#3fa05a' : '#2f7d46'; }
    else { const h = ACI.hash(x, y, 9); ch = h < 0.5 ? '.' : h < 0.8 ? ',' : "'"; col = '#2a5c3a'; }
  }
  return [ch, ACI.mix(NIGHT, col, light)];
});

// ---------- art (letters in the colour map pick colours from the palette)
const heroSpr = A.sprite({
  idle: ` o\n/|\\*\n/ \\\n---\n o\n/|\\*\n/ \\`.replace(/^/, ''),
  walk: ` o\n/|\\*\n/ \\\n---\n o\n/|\\*\n |\\\n---\n o\n/|\\*\n/ \\\n---\n o\n/|\\*\n/|`,
}, { color: '#cfe', fps: 7, palette: { l: '#ffd070' }, colors: {
  idle: ` b\nbbbl\nbbb`, walk: ` b\nbbbl\nbbb`,
} });
const treeSpr = A.sprite(String.raw`
  ^
 /^\
/^^^\
 /^^^\
  |||`.replace('/^^^\\\n /^^^\\', '/^^^\\\n/^^^^^\\'), { color: '#2f8a4a', palette: { t: '#7a5230' }, colors: `
  g
 ggg
ggggg
ggggggg
  ttt` });
const wispSpr = A.sprite({ idle: ` .-.\n( o )\n '-'\n---\n .-.\n( O )\n '-'\n---\n .~.\n( o )\n '~'` }, { color: '#7ff0e0', fps: 6 });
const flySpr = A.sprite({ idle: `.*.\n---\n-*-\n---\n+*+` }, { color: '#e8ff7a', fps: 5 });
const fireSpr = ACI.sprite(`(\n)\\`, { color: '#ff8a30' });

// ---------- world
hero = game.add(heroSpr, { x: CAMP.x + 6, y: CAMP.y + 4, label: 'you', labelColor: '#9fd', reflect: true });
game.follow(hero, { lerp: 0.12 });
const trunks = [];
for (let i = 0; i < 90; i++) {
  const x = Math.floor(ACI.hash(i, 1, 5) * (WORLD.cols - 8)) + 2, y = Math.floor(ACI.hash(i, 2, 5) * (WORLD.rows - 8)) + 2;
  if (Math.hypot(x - CAMP.x, (y - CAMP.y) * 1.8) < 16 || game.is('water', x + 3, y + 5) || game.is('water', x, y + 4)) continue;
  const t = game.add(treeSpr, { x, y, z: -1, reflect: false }); trunks.push({ x: x + 2, y: y + 3, w: 3, h: 2 });
}
const blocked = (x, y) => x < 1 || y < 0 || x > WORLD.cols - 4 || y > WORLD.rows - 4 || trunks.some(t => x + 1 > t.x - 1 && x + 1 < t.x + t.w + 0 && y + 2 >= t.y && y + 2 < t.y + t.h);

// campfire: a fire emitter + a smoke emitter, and it flickers the light in the layer above
game.add(fireSpr, { x: CAMP.x, y: CAMP.y, reflect: false });
game.emitter({ preset: 'fire', x: CAMP.x + 0.5, y: CAMP.y, rate: 28 });
game.emitter({ preset: 'smoke', x: CAMP.x + 0.5, y: CAMP.y - 2, rate: 4 });
game.emitter({ preset: 'embers', x: CAMP.x + 0.5, y: CAMP.y - 1, rate: 6 });

// fireflies
const flies = [];
function spawnFly() {
  let x, y; do { x = rand(6, WORLD.cols - 8); y = rand(4, WORLD.rows - 6); } while (game.is('water', x, y) || Math.hypot(x - hero.x, y - hero.y) < 20);
  const f = game.add(flySpr, { x, y, z: 2, reflect: true }); f.by = y; f.ph = Math.random() * 6; f.update = (dt, e) => { e.y = e.by + Math.sin(game.time * 1.7 + e.ph) * 1.2; e.x += Math.cos(game.time * 0.9 + e.ph) * 0.8 * dt; };
  f.glow = game.emitter({ preset: 'sparkle', follow: f, offset: [0, 0], rate: 2.5, count: 1, speed: [0.5, 1.5], life: [0.3, 0.7] });
  flies.push(f); return f;
}
for (let i = 0; i < 12; i++) spawnFly();
// wisps
const wisps = [];
for (let i = 0; i < 3; i++) {
  const w = game.add(wispSpr, { x: rand(60, WORLD.cols - 20), y: rand(8, WORLD.rows - 12), z: 3, reflect: true }); w.speed = 5;
  w.update = (dt, e) => {
    const dx = hero.x - e.x, dy = hero.y - e.y, d = Math.hypot(dx * 0.55, dy);
    if (d < 20 && !won) { e.x += dx / (d || 1) * 0.55 * e.speed * dt * 1.4; e.y += dy / (d || 1) * e.speed * dt * 0.7; }
    else { e.x += Math.cos(game.time * 0.5 + e.id) * 2 * dt; e.y += Math.sin(game.time * 0.7 + e.id * 2) * 1 * dt; }
  };
  game.emitter({ preset: { chars: '.:', colors: ['#7ff0e0', '#1a4a50'], speed: [0.5, 2], angle: [0, 360], life: [0.3, 0.6] }, follow: w, offset: [2, 1], rate: 12 });
  wisps.push(w);
}
// dust behind the hero while walking
const dust = game.trail(hero, 'dust', { rate: 0, offset: [1, 2] });

// weather: rain streams from a strip that follows the camera
const rain = game.emitter({ preset: 'rain', area: { x: 0, y: 0, w: 100, h: 1 }, rate: 0, active: true });
let raining = false;
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r') { raining = !raining; rain.rate = raining ? 110 : 0; } });

// ---------- game
let caught = 0, won = false, hint = 6, hurt = 0, t0 = 0;
game.onUpdate(dt => {
  t0 += dt;
  // keep rain area glued to the camera
  rain.area.x = game.camera.x - 6; rain.area.y = game.camera.y - 1; rain.area.w = game.viewCols + 12;
  if (won) return;
  let mx = (game.key('d', 'ArrowRight') ? 1 : 0) - (game.key('a', 'ArrowLeft') ? 1 : 0), my = (game.key('s', 'ArrowDown') ? 1 : 0) - (game.key('w', 'ArrowUp') ? 1 : 0);
  const moving = !!(mx || my), spd = 15;
  if (moving) {
    const k = mx && my ? 0.75 : 1;
    const nx = hero.x + mx * spd * dt * k, ny = hero.y + my * spd * 0.55 * dt * k;
    if (!blocked(nx, hero.y)) hero.x = nx; if (!blocked(hero.x, ny)) hero.y = ny;
    if (mx) hero.flipX = mx < 0;
    hint = Math.min(hint, 3);
  }
  game.animate(hero, moving ? 'walk' : 'idle', { restart: false, fps: moving ? 9 : 2 });
  dust.rate = moving ? 14 : 0;
  hurt -= dt;
  // collect
  for (const f of flies.slice()) {
    if (Math.abs(f.x - (hero.x + 1)) < 2.8 && Math.abs(f.y - hero.y - 1) < 2) {
      flies.splice(flies.indexOf(f), 1); f.glow.remove(); game.remove(f); caught++;
      game.burst(f.x, f.y, 'pickup'); game.floatText(f.x, f.y - 1, caught + '/12', { color: '#e8ff7a' });
      if (caught >= 12) win();
    }
  }
  // wisps bite
  if (hurt <= 0) for (const w of wisps) if (Math.abs(w.x + 2 - hero.x - 1) < 3.2 && Math.abs(w.y - hero.y) < 2) {
    hurt = 1.2; game.shake(3, 0.3); game.flash(hero, '#ff5566', 0.4); game.burst(hero.x + 1, hero.y + 1, 'hit');
    const dir = Math.sign(hero.x - w.x) || 1, nx = hero.x + dir * 6;
    if (!blocked(nx, hero.y)) game.tween(hero, { x: nx }, 0.25, { ease: 'outCubic' });
    if (caught > 0) { caught--; spawnFly(); game.floatText(hero.x + 1, hero.y - 2, '-1', { color: '#ff5566' }); }
  }
});
async function win() {
  won = true; hint = 0;
  game.burst(hero.x + 1, hero.y - 2, 'confetti', { count: 120 });
  wisps.forEach(w => { game.burst(w.x + 2, w.y + 1, 'explosion', { count: 20 }); game.remove(w); });
  game.shake(4, 0.5);
  await game.wait(1.2);
  const cx = game.camera.x + game.viewCols / 2, cy = game.camera.y + game.viewRows / 2 - 4;
  game.fx.text(cx, cy, 'THE FOREST IS LIT', { center: true, effects: ['rainbow', 'wave'] });
  game.fx.text(cx, cy + 2, 'press F5 to play again', { center: true, color: '#9ab', effects: ['blink'] });
}
game.onDraw(() => {
  hud.text(2, 0, 'FIREFLIES ' + caught + '/12', '#e8ff7a');
  hud.text(game.viewCols - 22, 0, 'R: rain   WASD: move', '#567');
  if (hint > 0 && t0 > 0.3) { hint -= 1 / 60; hud.text(Math.floor(game.viewCols / 2) - 17, game.viewRows - 3, 'Catch the 12 fireflies. Avoid the wisps.', '#cfe'); }
});
</script>
</body></html>
